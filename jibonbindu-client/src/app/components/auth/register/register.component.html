<div class="auth-page">
  <div class="auth-bg" aria-hidden="true"></div>
  <main class="auth-card">
    <aside class="auth-side">
      <h1>Join the community</h1>
      <span class="auth-bar"></span>
      <p>Create an account to request blood donations or register as an active donor.</p>
    </aside>

    <section class="auth-main">
      @if (errorMessage()) {
        <div class="alert alert-danger py-2">
          {{ errorMessage() }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <div class="mb-2">
          <label for="reg-name" class="form-label">Full Name</label>
          <input
            id="reg-name"
            type="text"
            class="form-control"
            [(ngModel)]="fullName"
            name="fullName"
            placeholder="Your full name"
            required
          />
        </div>

        <div class="mb-2">
          <label for="reg-email" class="form-label">Email</label>
          <input
            id="reg-email"
            type="email"
            class="form-control"
            [(ngModel)]="email"
            name="email"
            placeholder="Your email address"
            required
          />
        </div>

        <div class="mb-2">
          <label for="reg-pass" class="form-label">Password</label>
          <div class="password-box">
            <input
              id="reg-pass"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              [(ngModel)]="password"
              name="password"
              placeholder="Create a password"
              required
            />
            <button
              type="button"
              class="password-toggle-btn"
              (click)="showPassword = !showPassword"
            >
              {{ showPassword ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <div class="mb-2">
          <label for="reg-conf" class="form-label">Confirm Password</label>
          <input
            id="reg-conf"
            type="password"
            class="form-control"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter password"
            required
          />
        </div>

        <div class="mb-3">
          <label for="reg-role" class="form-label">I am joining as</label>
          <select id="reg-role" class="form-select" [(ngModel)]="selectedRole" name="selectedRole">
            <option value="Seeker">Seeker</option>
            <option value="BloodDonor">Blood-Donor</option>
            <option value="FundDonor">Fund-Donor</option>
            <option value="Member">Member</option>
          </select>
        </div>

        <div class="form-check mb-3">
          <input
            id="reg-terms"
            type="checkbox"
            class="form-check-input"
            [(ngModel)]="acceptedPolicy"
            name="acceptedPolicy"
            required
          />
          <label for="reg-terms" class="form-check-label">
            I accept the terms & privacy policy
          </label>
        </div>

        <button
          type="submit"
          class="btn-jbf-action w-100"
          [disabled]="isBusy() || !fullName || !email || !password || !confirmPassword || !acceptedPolicy"
        >
          {{ isBusy() ? 'Registering…' : 'Create Account' }}
        </button>
      </form>

      <nav class="auth-footer-links">
        <span>
          Already registered? <a routerLink="/login">Log in here</a>
        </span>
      </nav>
    </section>
  </main>
</div>
