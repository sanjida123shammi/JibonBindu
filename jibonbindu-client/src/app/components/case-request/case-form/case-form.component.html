<div class="content-header">
  <div class="header-titles">
    <h2 class="section-heading">
      {{ isEditMode() ? t('editCaseRequestHeading') + ' #' + caseId : t('newCaseRequestHeading') }}
    </h2>
    <span class="sub-heading">{{ t('newCaseRequestSub') }}</span>
  </div>
</div>

<div class="case-form-container">
  <div class="graph-card case-card">
    <button
      type="button"
      class="form-close-btn"
      (click)="cancel()"
      title="Cancel and return to Case List"
    >
      &times;
    </button>

    <div class="case-card-header">
      <div class="case-badge-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
        </svg>
      </div>
      <div class="case-header-text">
        <h3 class="card-main-title">
          {{ isEditMode() ? t('updateCaseRequest') : t('emergencyBloodFormTitle') }}
        </h3>
        <p class="card-sub-title">
          {{ t('emergencyBloodFormSub') }}
        </p>
      </div>
    </div>

    @if (errorMessage()) {
      <div class="alert-banner alert-error">
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="case-fields-grid">
      <!-- Row 1: Creation Date & Blood Group -->
      <div class="field-row-split">
        <div class="split-col">
          <label class="field-label" for="date">{{ t('creationDate') }}</label>
          <div class="field-input-box">
            <input
              id="date"
              type="date"
              name="date"
              [(ngModel)]="date"
              class="field-input date-input-clickable"
              (click)="openDatePicker($event)"
              required
            />
          </div>
        </div>

        <div class="split-col">
          <label class="field-label" for="bloodGroup">{{ t('requiredBloodGroup') }}</label>
          <div class="field-input-box">
            <select
              id="bloodGroup"
              name="bloodGroup"
              [(ngModel)]="bloodGroup"
              class="field-input select-input"
            >
              @for (bg of bloodGroups; track bg) {
                <option [value]="bg">{{ bg }}</option>
              }
            </select>
          </div>
        </div>
      </div>

      <!-- Row 2: Patient Problem -->
      <div class="field-row">
        <label class="field-label" for="patientProblem">{{ t('patientProblem') }}</label>
        <div class="field-input-box">
          <input
            id="patientProblem"
            type="text"
            name="patientProblem"
            [(ngModel)]="patientProblem"
            placeholder="e.g. Thalassemia regular blood transfusion / Emergency Surgery"
            class="field-input"
            required
          />
        </div>
      </div>

      <!-- Row 3: Bags Quantity & Hemoglobin Level -->
      <div class="field-row-split">
        <div class="split-col">
          <label class="field-label" for="bloodQuantity">{{ t('bloodQuantity') }}</label>
          <div class="field-input-box">
            <input
              id="bloodQuantity"
              type="number"
              name="bloodQuantity"
              [(ngModel)]="bloodQuantity"
              min="1"
              max="20"
              class="field-input"
              required
            />
          </div>
        </div>

        <div class="split-col">
          <label class="field-label" for="hemoglobin">{{ t('hemoglobin') }}</label>
          <div class="field-input-box">
            <input
              id="hemoglobin"
              type="number"
              step="0.1"
              name="hemoglobin"
              [(ngModel)]="hemoglobin"
              placeholder="e.g. 8.5"
              class="field-input"
            />
          </div>
        </div>
      </div>

      <!-- Row 4: Required Donation Date & Donation Time -->
      <div class="field-row-split">
        <div class="split-col">
          <label class="field-label" for="donationDate">{{ t('donationDate') }}</label>
          <div class="field-input-box">
            <input
              id="donationDate"
              type="date"
              name="donationDate"
              [(ngModel)]="donationDate"
              class="field-input date-input-clickable"
              (click)="openDatePicker($event)"
              required
            />
          </div>
        </div>

        <div class="split-col">
          <label class="field-label" for="donationTime">{{ t('donationTime') }}</label>
          <div class="field-input-box">
            <input
              id="donationTime"
              type="text"
              name="donationTime"
              [(ngModel)]="donationTime"
              placeholder="e.g. 10:30 AM"
              class="field-input"
              required
            />
          </div>
        </div>
      </div>

      <!-- Row 5: Donation Place & Contact Number -->
      <div class="field-row-split">
        <div class="split-col">
          <label class="field-label" for="donationPlace">{{ t('donationPlace') }}</label>
          <div class="field-input-box">
            <input
              id="donationPlace"
              type="text"
              name="donationPlace"
              [(ngModel)]="donationPlace"
              placeholder="e.g. Dhaka Medical College Hospital, Ward 4"
              class="field-input"
              required
            />
          </div>
        </div>

        <div class="split-col">
          <label class="field-label" for="contactNo">{{ t('contactNumber') }}</label>
          <div class="field-input-box">
            <input
              id="contactNo"
              type="text"
              name="contactNo"
              [(ngModel)]="contactNo"
              placeholder="+8801712345678"
              class="field-input"
              required
            />
          </div>
        </div>
      </div>

      <!-- Row 6: Reference & Case Status -->
      <div class="field-row-split">
        <div class="split-col">
          <label class="field-label" for="reference">{{ t('reference') }}</label>
          <div class="field-input-box">
            <input
              id="reference"
              type="text"
              name="reference"
              [(ngModel)]="reference"
              placeholder="e.g. Dr. Kabir / Hospital Social Worker / Self"
              class="field-input"
            />
          </div>
        </div>

        <div class="split-col">
          <label class="field-label" for="status">{{ t('caseStatus') }}</label>
          <div class="field-input-box">
            <select id="status" name="status" [(ngModel)]="status" class="field-input select-input">
              @for (st of availableStatuses; track st) {
                <option [value]="st">{{ st }}</option>
              }
            </select>
          </div>
        </div>
      </div>

      <!-- Row 7: Remarks -->
      <div class="field-row">
        <label class="field-label" for="remarks">{{ t('remarks') }}</label>
        <div class="field-input-box">
          <textarea
            id="remarks"
            name="remarks"
            [(ngModel)]="remarks"
            rows="3"
            placeholder="Special instructions, patient medical background, or emergency urgency notes..."
            class="field-input textarea-input"
          ></textarea>
        </div>
      </div>

      <!-- Row 8: Patient Relationship Checkbox -->
      <div class="field-row checkbox-field-row">
        <label class="checkbox-container">
          <input type="checkbox" name="isYourCase" [(ngModel)]="isYourCase" />
          <span class="checkmark"></span>
          <span class="checkbox-text">{{ t('patientRelationshipCheck') }}</span>
        </label>
      </div>

      <!-- Action Buttons -->
      <div class="form-actions-row">
        <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
          {{
            isSubmitting()
              ? t('loading')
              : isEditMode()
                ? t('updateCaseRequest')
                : t('createCaseRequest')
          }}
        </button>
        <button type="button" class="btn-secondary" (click)="cancel()" [disabled]="isSubmitting()">
          {{ t('cancel') }}
        </button>
      </div>
    </form>
  </div>
</div>
