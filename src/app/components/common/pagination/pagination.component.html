<div class="jb-pagination">
  <button
    type="button"
    class="page-btn nav-btn"
    [disabled]="currentPage === 1"
    (click)="previous()"
  >
    Previous
  </button>

  @for (page of pages; track page) {
    <button
      type="button"
      class="page-btn num-btn"
      [class.active]="page === currentPage"
      (click)="setPage(page)"
    >
      {{ page }}
    </button>
  }

  <button
    type="button"
    class="page-btn nav-btn"
    [disabled]="currentPage === totalPages"
    (click)="next()"
  >
    Next
  </button>
</div>
